[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "async-solipsism"
dynamic = ["version"]
readme = "README.md"
description = "Asyncio event loop that doesn't interact with the outside world"
authors = [
    {name = "Bruce Merry", email = "bmerry@gmail.com"}
]
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Testing :: Mocking",
]

[project.urls]
Homepage = "https://github.com/bmerry/async-solipsism"

[dependency-groups]
test = [
    "pre-commit",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-mock",
]

[tool.setuptools_scm]

[tool.setuptools.dynamic]
version = {attr = "async_solipsism.__version__"}

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "W", "UP", "RUF100"]
