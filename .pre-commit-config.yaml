repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: pip-compile
        args: ["--python-version=3.11", "--universal", "--output-file=requirements.txt", "--group=test", "pyproject.toml"]
        files: '^(?:pyproject\.toml|requirements\.txt)$'
